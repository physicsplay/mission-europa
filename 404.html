<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lost in space · Mission Europa</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--paper:#f8f5ff;--ink:#111119;--lime:#9bff3a;--purple:#5e49ff;--muted:#5f5e6e}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
    main{max-width:640px}
    p.k{font-size:.72rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);margin:0 0 12px}
    h1{font-size:clamp(3.4rem,12vw,7rem);line-height:.85;letter-spacing:-.07em;margin:0;font-weight:950}
    h1 em{font-family:Georgia,"Times New Roman",serif;font-weight:500}
    p{font-size:1.1rem;color:var(--muted);margin:22px 0 30px}
    a{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:12px 20px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;text-decoration:none;box-shadow:6px 6px 0 var(--lime)}
    a:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="k">Error 404 · signal lost</p>
    <h1>Lost in <em>space.</em></h1>
    <p>This page drifted off course, a bit like Philae after its first bounce. The mission is still on.</p>
    <a href="/">Back to Mission Control</a>
  </main>
</body>
</html>
